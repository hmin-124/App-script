<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 12px 16px 16px;
      }
      textarea {
        width: 100%;
        height: 440px;
        box-sizing: border-box;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.35;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
        white-space: pre;
      }
      .actions {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      #copyStatus {
        color: #188038;
        font-size: 12px;
        visibility: hidden;
      }
      button {
        background: #1a73e8;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #1558b3;
      }
      .hint {
        color: #5f6368;
        font-size: 12px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      Tin nhắn dựng từ các dòng tick cột B trên sheet 2026. Bấm Copy rồi dán vào chat.
    </div>
    <textarea id="messageBox" readonly><?!= message ?></textarea>
    <div class="actions">
      <span id="copyStatus">Đã copy!</span>
      <button type="button" onclick="copyMessage()">📋 Copy nội dung</button>
    </div>
    <script>
      function copyMessage() {
        const box = document.getElementById('messageBox');
        box.focus();
        box.select();
        try {
          document.execCommand('copy');
        } catch (e) {
          navigator.clipboard && navigator.clipboard.writeText(box.value);
        }
        const status = document.getElementById('copyStatus');
        status.style.visibility = 'visible';
        setTimeout(function () {
          status.style.visibility = 'hidden';
        }, 2000);
      }
    </script>
  </body>
</html>
