<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 12px;
      }
      textarea {
        width: 100%;
        height: 420px;
        box-sizing: border-box;
        font-family: 'Courier New', monospace;
        font-size: 12.5px;
        white-space: pre;
        resize: vertical;
      }
      .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        color: #fff;
      }
      .btn-copy {
        background: #1a73e8;
      }
      .btn-chat {
        background: #34a853;
      }
      .btn-telegram {
        background: #039be5;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #555;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <textarea id="message" readonly><?= message ?></textarea>

    <div class="actions">
      <button class="btn-copy" onclick="copyMessage()">📋 Copy</button>
      <!-- Hai nút dưới đây đã sẵn sàng gọi ApprovalService.sendToGoogleChat /
           sendToTelegram (qua Code.gs); logic gửi thật sẽ được bổ sung sau. -->
      <button class="btn-chat" onclick="sendGoogleChat()">💬 Gửi Google Chat</button>
      <button class="btn-telegram" onclick="sendTelegram()">✈️ Gửi Telegram</button>
    </div>

    <div id="status"></div>

    <script>
      var textarea = document.getElementById('message');
      var status = document.getElementById('status');

      function setStatus(text) {
        status.textContent = text;
      }

      function copyMessage() {
        textarea.select();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(textarea.value)
            .then(function () {
              setStatus('Đã copy tin nhắn vào clipboard.');
            })
            .catch(function () {
              document.execCommand('copy');
              setStatus('Đã copy tin nhắn vào clipboard.');
            });
        } else {
          document.execCommand('copy');
          setStatus('Đã copy tin nhắn vào clipboard.');
        }
      }

      function sendGoogleChat() {
        setStatus('Đang gửi...');
        google.script.run
          .withSuccessHandler(function (result) {
            setStatus(result.info);
          })
          .withFailureHandler(function (error) {
            setStatus('Lỗi: ' + error.message);
          })
          .sendMessageToGoogleChat(textarea.value);
      }

      function sendTelegram() {
        setStatus('Đang gửi...');
        google.script.run
          .withSuccessHandler(function (result) {
            setStatus(result.info);
          })
          .withFailureHandler(function (error) {
            setStatus('Lỗi: ' + error.message);
          })
          .sendMessageToTelegram(textarea.value);
      }
    </script>
  </body>
</html>
